<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrace | Příčná Offices</title>
    <link rel="icon" type="image/png" href="../images/fav_icon_final.png">
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <!-- Login Screen -->
    <div id="login-screen" class="login-container">
        <div class="login-box">
            <div class="login-header">
                <h1>🔐 Přihlášení</h1>
                <p>Administrace Příčná Offices</p>
            </div>
            <form id="login-form">
                <div class="form-group">
                    <label for="username">Uživatelské jméno</label>
                    <input type="text" id="username" name="username" required autofocus>
                </div>
                <div class="form-group">
                    <label for="password">Heslo</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <div id="login-error" class="error-message" style="display: none;"></div>
                <button type="submit" class="btn btn-primary">Přihlásit se</button>
            </form>
        </div>
    </div>

    <!-- Admin Dashboard -->
    <div id="admin-dashboard" style="display: none;">
        <!-- Header -->
        <header class="admin-header">
            <div class="container">
                <div class="header-left">
                    <h1>Administrace</h1>
                    <p class="subtitle">Příčná Offices &amp; Apartments</p>
                </div>
                <div class="header-right">
                    <span class="user-info">
                        <i class="fas fa-user"></i>
                        <span id="logged-user">Recepce</span>
                    </span>
                    <button id="logout-btn" class="btn btn-secondary">
                        <i class="fas fa-sign-out-alt"></i> Odhlásit
                    </button>
                </div>
            </div>
        </header>

        <!-- Tabs -->
        <nav class="admin-tabs">
            <div class="container">
                <button class="admin-tab active" data-view="reservations">
                    <i class="fas fa-calendar-alt"></i> Rezervace
                </button>
                <button class="admin-tab" data-view="properties">
                    <i class="fas fa-building"></i> Byty a kanceláře
                </button>
            </div>
        </nav>

        <!-- Main Content -->
        <main class="admin-main">
            <div class="container">
                <!-- ===== REZERVACE ===== -->
                <div id="view-reservations">
                    <!-- Day Navigation -->
                    <div class="day-navigation">
                        <button id="prev-day" class="btn btn-icon">
                            <i class="fas fa-chevron-left"></i>
                        </button>
                        <div class="current-day-info">
                            <h2 id="current-day-text">Dnes</h2>
                            <p id="current-date-text"></p>
                        </div>
                        <button id="next-day" class="btn btn-icon">
                            <i class="fas fa-chevron-right"></i>
                        </button>
                    </div>

                    <!-- Quick Actions -->
                    <div class="quick-actions">
                        <button id="today-btn" class="btn btn-outline">
                            <i class="fas fa-calendar-day"></i> Dnes
                        </button>
                        <div class="date-picker-wrapper">
                            <button id="pick-date-btn" class="btn btn-outline" type="button">
                                <i class="fas fa-calendar-alt"></i> Vybrat datum
                            </button>
                            <input type="date" id="date-picker-input">
                        </div>
                        <button id="create-reservation-btn" class="btn btn-primary">
                            <i class="fas fa-plus"></i> Nová rezervace
                        </button>
                    </div>

                    <!-- Time Slots Grid -->
                    <div class="section-card">
                        <div class="section-header">
                            <h3><i class="fas fa-clock"></i> Časové sloty</h3>
                            <div class="legend">
                                <span class="legend-item"><span class="legend-color available"></span> Volné</span>
                                <span class="legend-item"><span class="legend-color reserved"></span> Rezervováno</span>
                            </div>
                        </div>
                        <div id="time-slots-grid" class="admin-time-slots"></div>
                    </div>

                    <!-- Today's Reservations Summary -->
                    <div class="section-card">
                        <div class="section-header">
                            <h3><i class="fas fa-list"></i> Rezervace pro vybraný den</h3>
                            <span id="day-stats" class="day-stats"></span>
                        </div>
                        <div id="day-reservations-list"></div>
                    </div>
                </div>

                <!-- ===== NEMOVITOSTI ===== -->
                <div id="view-properties" style="display: none;">
                    <div class="quick-actions">
                        <div class="filter-group">
                            <button class="btn btn-outline property-filter active" data-filter="all">Vše</button>
                            <button class="btn btn-outline property-filter" data-filter="office">Kanceláře</button>
                            <button class="btn btn-outline property-filter" data-filter="apartment">Byty</button>
                        </div>
                        <button id="create-property-btn" class="btn btn-primary">
                            <i class="fas fa-plus"></i> Přidat nabídku
                        </button>
                    </div>

                    <div class="section-card">
                        <div class="section-header">
                            <h3><i class="fas fa-building"></i> Nabídky na webu</h3>
                            <span id="properties-stats" class="day-stats"></span>
                        </div>
                        <div id="properties-list"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Reservation Detail Modal -->
    <div id="detail-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Detail rezervace</h2>
                <span class="modal-close">&times;</span>
            </div>
            <div id="detail-content"></div>
        </div>
    </div>

    <!-- Create Reservation Modal -->
    <div id="create-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Nová rezervace</h2>
                <span class="modal-close">&times;</span>
            </div>
            <form id="create-reservation-form">
                <div class="form-group">
                    <label for="res-date">Datum *</label>
                    <input type="date" id="res-date" name="date" required>
                </div>

                <div class="form-group">
                    <label>Časové sloty *</label>
                    <div id="modal-time-slots" class="time-slots-grid"></div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="res-name">Jméno a příjmení *</label>
                        <input type="text" id="res-name" name="name" required>
                    </div>
                    <div class="form-group">
                        <label for="res-email">Email *</label>
                        <input type="email" id="res-email" name="email" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="res-phone">Telefon *</label>
                        <input type="tel" id="res-phone" name="phone" required>
                    </div>
                    <div class="form-group">
                        <label for="res-company">Společnost</label>
                        <input type="text" id="res-company" name="company">
                    </div>
                </div>

                <div class="form-group">
                    <label for="res-message">Poznámka</label>
                    <textarea id="res-message" name="message" rows="3"></textarea>
                </div>

                <div class="form-group">
                    <label for="res-price">Celková cena (Kč) *</label>
                    <input type="number" id="res-price" name="totalPrice" required readonly>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary modal-close">Zrušit</button>
                    <button type="submit" class="btn btn-primary">Vytvořit rezervaci</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Property Edit Modal -->
    <div id="property-modal" class="modal">
        <div class="modal-content modal-content-wide">
            <div class="modal-header">
                <h2 id="property-modal-title">Nová nabídka</h2>
                <span class="modal-close">&times;</span>
            </div>
            <form id="property-form">
                <div class="form-row">
                    <div class="form-group">
                        <label for="prop-type">Typ *</label>
                        <select id="prop-type" required>
                            <option value="office">Kancelář</option>
                            <option value="apartment">Byt</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="prop-title">Název *</label>
                        <input type="text" id="prop-title" placeholder="např. Kancelář 30 m²" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group" id="prop-building-group">
                        <label for="prop-building">Budova</label>
                        <select id="prop-building">
                            <option value="Příčná 1">Příčná 1</option>
                            <option value="Příčná 2">Příčná 2</option>
                            <option value="Dělnická 41">Dělnická 41</option>
                            <option value="">Jiná / neuvedeno</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="prop-location">Adresa</label>
                        <input type="text" id="prop-location" placeholder="např. Příčná 1, Havířov - Město">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="prop-size">Velikost</label>
                        <input type="text" id="prop-size" placeholder="např. 30 m²">
                    </div>
                    <div class="form-group" id="prop-capacity-group">
                        <label for="prop-capacity">Kapacita</label>
                        <input type="text" id="prop-capacity" placeholder="např. Ideální pro 2-4 osoby">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="prop-price">Nájem</label>
                        <input type="text" id="prop-price" placeholder="např. 4 600 Kč/měsíc">
                    </div>
                    <div class="form-group">
                        <label for="prop-utilities">Služby</label>
                        <input type="text" id="prop-utilities" placeholder="např. 5 000 Kč/měsíc">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="prop-deposit">Kauce</label>
                        <input type="text" id="prop-deposit" placeholder="např. 20 000 Kč">
                    </div>
                    <div class="form-group" id="prop-available-group">
                        <label for="prop-available">Dostupnost</label>
                        <input type="text" id="prop-available" placeholder="např. Ihned">
                    </div>
                </div>

                <div class="form-group">
                    <label for="prop-vat">Poznámka k DPH</label>
                    <input type="text" id="prop-vat" placeholder="např. Příčná Offices s.r.o. je plátce DPH - uvedené ceny jsou bez DPH">
                </div>

                <div class="form-group">
                    <label for="prop-description">Popis</label>
                    <textarea id="prop-description" rows="4" placeholder="Podrobný popis nabídky..."></textarea>
                </div>

                <div class="form-group">
                    <label for="prop-features">Vybavení a výhody <small>(každá položka na nový řádek)</small></label>
                    <textarea id="prop-features" rows="5" placeholder="Recepce v budově&#10;Klidné a příjemné pracovní prostředí&#10;..."></textarea>
                </div>

                <div class="form-group">
                    <label>Fotky <small>(první fotka je hlavní, pořadí změníte šipkami)</small></label>
                    <div id="prop-images" class="prop-images-grid"></div>
                    <label class="btn btn-outline upload-btn" for="prop-image-input">
                        <i class="fas fa-cloud-upload-alt"></i> Nahrát fotky
                        <input type="file" id="prop-image-input" accept="image/jpeg,image/png,image/webp" multiple hidden>
                    </label>
                    <span id="prop-upload-status" class="upload-status"></span>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="prop-sort">Pořadí <small>(nižší = výš na stránce)</small></label>
                        <input type="number" id="prop-sort" value="0">
                    </div>
                    <div class="form-group checkbox-group">
                        <label class="checkbox-label">
                            <input type="checkbox" id="prop-published" checked>
                            <span>Zveřejnit na webu</span>
                        </label>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary modal-close">Zrušit</button>
                    <button type="submit" class="btn btn-primary" id="property-save-btn">Uložit</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/admin.js"></script>
</body>
</html>
