name = "pricna-api"
main = "worker-full.js"
compatibility_date = "2024-10-01"

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "pricna-db"
database_id = "349fbd92-9ef6-486f-bc7d-332ceb471c73"

# R2 bucket pro fotky nemovitostí
# Před prvním nasazením vytvořte: wrangler r2 bucket create pricna-images
[[r2_buckets]]
binding = "IMAGES"
bucket_name = "pricna-images"

# Environment Variables
[vars]
NODE_ENV = "production"
FRONTEND_URL = "https://pricna.cz"
ADMIN_URL = "https://rezervace.pricna.cz"

# Secrets (nastavíte přes `wrangler secret put NAZEV`, lokálně přes .dev.vars):
# MAILTRAP_PASS        - API token Mailtrap (bez něj se e-maily neodesílají)
# JWT_SECRET           - náhodný řetězec min. 32 znaků
# ADMIN_USERNAME       - přihlašovací jméno admina
# ADMIN_PASSWORD_HASH  - hash hesla, vygenerujte: node hash-password.mjs VaseHeslo
